[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pikapython-cli"
version = "0.1.0"
description = "PikaPython package, prebuild, and toolchain CLI"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
pikapython-cli = "pikapython_cli.__main__:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["pikapython_cli*"]

[tool.setuptools.package-data]
pikapython_cli = ["tools/*.json"]
